<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 176" width="860" height="176" role="img" aria-label="Segure A e toque Espaço: a barra mostra á, ã, â, à">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g font-family="'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif" text-anchor="middle" dominant-baseline="central">
    <!-- keycap A -->
    <rect x="8" y="44" width="88" height="88" rx="14" fill="#27272A" stroke="#3F3F46" stroke-width="2"/>
    <rect x="8" y="124" width="88" height="8" rx="4" fill="#18181B" opacity="0.6"/>
    <text x="52" y="86" font-size="36" font-weight="600" fill="#FAFAFA">A</text>
    <text x="120" y="88" font-size="32" fill="#71717A">+</text>
    <!-- keycap Espaço -->
    <rect x="144" y="44" width="220" height="88" rx="14" fill="#27272A" stroke="#3F3F46" stroke-width="2"/>
    <rect x="144" y="124" width="220" height="8" rx="4" fill="#18181B" opacity="0.6"/>
    <text x="254" y="86" font-size="26" font-weight="600" fill="#FAFAFA">Espaço</text>
    <!-- arrow -->
    <path d="M388 88 H428 M416 76 L430 88 L416 100" fill="none" stroke="#71717A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- accent bar (same metrics as the app, at 2x) -->
    <g filter="url(#shadow)">
      <rect x="456" y="24" width="388" height="128" rx="16" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    </g>
    <rect x="560" y="36" width="88" height="104" rx="12" fill="#2F6FDB"/>
    <text x="512" y="88" font-size="48" font-weight="600" fill="#E4E4E7">á</text>
    <text x="604" y="88" font-size="48" font-weight="600" fill="#FAFAFA">ã</text>
    <text x="696" y="88" font-size="48" font-weight="600" fill="#E4E4E7">â</text>
    <text x="788" y="88" font-size="48" font-weight="600" fill="#E4E4E7">à</text>
  </g>
</svg>
